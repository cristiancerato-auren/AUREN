name: Validate AUREN production
on:
  push:
    branches: ["main", "auren-living-development"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate production pages and scripts
        run: node scripts/check-auren.mjs
      - name: Set up Deno for Supabase Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check all AUREN Living Edge Functions
        run: deno check supabase/functions/create-living-checkout/index.ts supabase/functions/stripe-living-webhook/index.ts supabase/functions/send-living-order-email/index.ts
