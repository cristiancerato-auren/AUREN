name: Build AUREN native projects

on:
  workflow_dispatch:
  push:
    branches:
      - app/pwa-foundation
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "scripts/build-mobile.mjs"
      - "assets/**"
      - "*.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "offline.html"
      - ".github/workflows/native-projects.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build AUREN web assets
        run: npm run build:mobile && npm run check:mobile

      - name: Generate Android project
        run: npx cap add android

      - name: Generate iOS project
        run: npx cap add ios

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync web assets to native projects
        run: npx cap sync

      - name: Build Android debug and release APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Verify native project structure
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f android/app/build/outputs/bundle/release/app-release.aab
          test -f ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/App/Info.plist
          echo "Android debug APK, unsigned release APK and Play Store AAB built; iOS Xcode project scaffold generated."

      - name: Upload native project sources
        uses: actions/upload-artifact@v4
        with:
          name: auren-native-projects
          path: |
            android/
            ios/
            www/
            capacitor.config.json
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 14

  build-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build AUREN web assets
        run: npm run build:mobile && npm run check:mobile

      - name: Generate and sync iOS project
        run: npx cap add ios && npx cap sync ios

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iOS device archive
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios-device/AUREN.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Verify iOS build output
        run: |
          test -d build/ios-derived/Build/Products/Debug-iphonesimulator/App.app
          test -d build/ios-device/AUREN.xcarchive
          test -f ios/App/App.xcodeproj/project.pbxproj
          echo "iOS Simulator app and unsigned iOS device archive built successfully."

      - name: Upload iOS project and simulator app
        uses: actions/upload-artifact@v4
        with:
          name: auren-ios-simulator-build
          path: |
            ios/
            www/
            build/ios-derived/Build/Products/Debug-iphonesimulator/App.app
            build/ios-device/AUREN.xcarchive
            capacitor.config.json
            package.json
          if-no-files-found: error
          retention-days: 14
